# Refreshes the roads' "In the news" headlines once a day and commits them.
# Vercel deploys every push to main, so the commit is what puts them live.
# scripts/fetch-news.mjs explains the exit codes; docs/NEWS.md the whole job.
name: Daily road news

on:
  schedule:
    # 00:37 UTC = 06:07 IST. Off the hour: GitHub delays or drops scheduled
    # runs at :00 when everyone else's fire.
    - cron: '37 0 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Only these road ids, comma-separated (blank = the usual daily run)'
        required: false
        default: ''
      rules_changed:
        description: 'The matching rules changed on purpose — let headlines that no longer pass go'
        type: boolean
        default: false

permissions:
  contents: write

# never two runs at once: the second would fight the first over the same files
concurrency:
  group: daily-road-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    # ~140 queries three seconds apart: ten minutes on a normal day
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # the news scripts use nothing but Node itself — no npm install
      - name: Test the headline rules
        run: npm test

      - name: Fetch headlines
        id: fetch
        env:
          ONLY: ${{ inputs.only }}
          RULES_CHANGED: ${{ inputs.rules_changed && '--rules-changed' || '' }}
        run: |
          set +e
          node scripts/fetch-news.mjs ${ONLY:+--only "$ONLY"} $RULES_CHANGED
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 3 and 4 = Google refused before the day's queries were spent: what
          # the run has is good, so commit it; the next run carries on from there
          case "$code" in 0|3|4) ;; *) exit "$code" ;; esac

      - name: Commit and push
        run: |
          git add public/data/news
          if git diff --cached --quiet; then
            echo "No change in the news."
            exit 0
          fi
          with_news=$(node -p "require('./public/data/news/_status.json').withNews")
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Refresh road news ($with_news roads with headlines)"
          # someone may have pushed while this ran; the news files are this
          # job's alone, so a rebase onto their work cannot conflict
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((attempt * 15))
          done
          echo "::error::Could not push the news commit after three attempts"
          exit 1

      - name: Flag an unfinished run
        if: steps.fetch.outputs.code == '3'
        run: echo "::warning::Google refused before this run's queries were spent; the next run carries on from where it stopped."

      - name: Fail if Google keeps refusing
        if: steps.fetch.outputs.code == '4'
        run: |
          echo "::error::Google refused this job two runs in a row, or the rotation has not come round in three weeks. See docs/NEWS.md."
          exit 1
